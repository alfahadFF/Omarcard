<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>SCOR – Omar Alkhatib</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --primary:#F5B400; --primary-dark:#C98F00;
  --bg-main:#151515; --bg-secondary:#242424; --line:#333;
  --gray-metal:#667085; --text-white:#fff; --text-dark:#111827;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:#000; color:var(--text-white);
  font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Arabic','Noto Sans','PingFang SC','Microsoft YaHei',Tahoma,sans-serif;
  display:flex; justify-content:center; min-height:100vh;
}
.card{
  width:100%; max-width:480px; min-height:100vh; background:var(--bg-main);
  box-shadow:0 0 24px rgba(0,0,0,.8);
  display:flex; flex-direction:column; align-items:center;
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
}
.cover{display:block; width:100%; aspect-ratio:1000/387; height:auto; background:#000}
.profile{margin-top:-64px; margin-bottom:16px; position:relative}
.profile img{
  display:block; width:132px; height:132px; border-radius:50%; object-fit:cover;
  border:4px solid var(--primary); background:var(--bg-secondary);
  box-shadow:0 4px 14px rgba(0,0,0,.6);
}
.info{text-align:center; padding:0 24px}
.info h1{margin:0; font-size:26px; line-height:1.3; color:var(--primary); font-weight:700}
.role{margin:8px 0 0; font-size:17px; font-weight:600}
.company{margin:6px 0 28px; font-size:14px; line-height:1.6; color:#c4c8d0}
.list{width:100%; padding:0 24px; display:flex; flex-direction:column; gap:12px}
.row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--bg-secondary); border:1px solid var(--line); border-radius:12px; padding:10px 14px;
}
.meta{display:flex; flex-direction:column; min-width:0; flex:1}
.label{font-size:12px; color:#98a2b3; margin-bottom:3px}
.value{font-size:16px; font-weight:700; direction:ltr; unicode-bidi:isolate; overflow-wrap:anywhere}
html[dir="rtl"] .value{text-align:right}
html[dir="ltr"] .value{text-align:left}
.value.mail{font-size:15px}
.actions{display:flex; gap:10px; flex-shrink:0}
.ibtn{
  width:44px; height:44px; border-radius:10px; border:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:20px; text-decoration:none; transition:filter .2s;
}
.ibtn:hover{filter:brightness(.88)}
.ibtn:focus-visible,.wide:focus-visible{outline:3px solid #fff; outline-offset:2px}
.call{background:var(--gray-metal)} .wa{background:#25D366}
.wc{background:#07C160} .mail-b{background:#EA4335}
.wide{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
  padding:15px; border-radius:12px; text-decoration:none; font-size:16px; font-weight:700;
  background:var(--primary); color:var(--text-dark); border:0; cursor:pointer; font-family:inherit;
  transition:background .2s;
}
.wide:hover{background:var(--primary-dark)}
.divider{height:1px; background:var(--line); margin:6px 0}
.toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,20px); opacity:0; pointer-events:none;
  background:#fff; color:#111; padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600;
  transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.ibtn,.wide{transition:none}}
</style>
</head>

function showToast(msg){
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(showToast.h); showToast.h = setTimeout(() => toast.classList.remove('show'), 2200);
}

function photoB64(){
  try{
    const img = document.getElementById('photo'), c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    c.getContext('2d').drawImage(img, 0, 0, 256, 256);
    return c.toDataURL('image/jpeg', .85).split(',')[1];
  }catch(e){ return ''; }
}

document.getElementById('saveBtn').addEventListener('click', () => {
  const ph = photoB64();
  const lines = [
    'BEGIN:VCARD','VERSION:3.0',
    'N:Alkhatib;Omar;;Eng.;',
    'FN:Eng. Omar Alkhatib',
    'ORG:SCOR',
    'TITLE:COO',
    'TEL;TYPE=CELL,VOICE:+4915118316638',
    'EMAIL;TYPE=WORK:om@scor-sy.de',
    'URL:https://scor-sy.de'
  ];
  if (ph) lines.push('PHOTO;ENCODING=b;TYPE=JPEG:' + ph);
  lines.push('END:VCARD');
  const blob = new Blob([lines.join('\r\n')], {type:'text/vcard;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'Omar_Alkhatib_SCOR.vcf';
  document.body.appendChild(a); a.click(); a.remove();
});
